name: Setup and Build CallRec
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/CallRec-setup.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/callrec/app
          cat > settings.gradle.kts <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "CallRec"
          include(":app")
          GRADLE
          cat > build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application") version "8.9.2" apply false
              id("org.jetbrains.kotlin.android") version "2.1.20" apply false
          }
          GRADLE
          cat > gradle.properties <<'GRADLE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          GRADLE
          cat > app/build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.callrec.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.callrec.app"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1"
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          GRADLE
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <application android:allowBackup="false" android:label="CallRec" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          XML
          cat > app/src/main/java/com/callrec/app/MainActivity.kt <<'KOTLIN'
          package com.callrec.app

          import android.Manifest
          import android.app.Activity
          import android.content.pm.PackageManager
          import android.media.MediaPlayer
          import android.media.MediaRecorder
          import android.os.Build
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : Activity() {
              private var recorder: MediaRecorder? = null
              private var player: MediaPlayer? = null
              private var currentFile: File? = null
              private lateinit var status: TextView
              private lateinit var start: Button
              private lateinit var stop: Button
              private lateinit var play: Button

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 48, 32, 32)
                  }
                  val title = TextView(this).apply { text = "CallRec v0.1"; textSize = 26f }
                  status = TextView(this).apply {
                      text = "Тест записи микрофона. Запись собеседника не гарантируется."
                      textSize = 16f
                      setPadding(0, 24, 0, 24)
                  }
                  start = Button(this).apply { text = "Начать запись" }
                  stop = Button(this).apply { text = "Остановить"; isEnabled = false }
                  play = Button(this).apply { text = "Прослушать"; isEnabled = false }
                  layout.addView(title); layout.addView(status)
                  layout.addView(start); layout.addView(stop); layout.addView(play)
                  setContentView(layout)
                  start.setOnClickListener {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1)
                      } else beginRecording()
                  }
                  stop.setOnClickListener { endRecording() }
                  play.setOnClickListener { playRecording() }
              }

              private fun beginRecording() {
                  val dir = File(filesDir, "recordings").apply { mkdirs() }
                  val name = "recording_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date()) + ".m4a"
                  val file = File(dir, name)
                  try {
                      val r = if (Build.VERSION.SDK_INT >= 31) MediaRecorder(this) else MediaRecorder()
                      r.setAudioSource(MediaRecorder.AudioSource.MIC)
                      r.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                      r.setAudioEncoder(MediaRecorder.AudioEncoder.AAC)
                      r.setAudioEncodingBitRate(128000)
                      r.setAudioSamplingRate(44100)
                      r.setOutputFile(file.absolutePath)
                      r.prepare()
                      r.start()
                      recorder = r
                      currentFile = file
                      status.text = "Идёт запись: ${file.name}"
                      start.isEnabled = false; stop.isEnabled = true; play.isEnabled = false
                  } catch (e: Exception) {
                      recorder?.release(); recorder = null
                      status.text = "Ошибка запуска: ${e.message}"
                  }
              }

              private fun endRecording() {
                  try {
                      recorder?.stop()
                      status.text = "Сохранено: ${currentFile?.name}"
                      play.isEnabled = true
                  } catch (e: Exception) {
                      currentFile?.delete()
                      status.text = "Не удалось сохранить запись: ${e.message}"
                      play.isEnabled = false
                  } finally {
                      recorder?.release(); recorder = null
                      start.isEnabled = true; stop.isEnabled = false
                  }
              }

              private fun playRecording() {
                  val file = currentFile ?: return
                  player?.release()
                  try {
                      player = MediaPlayer().apply {
                          setDataSource(file.absolutePath)
                          setOnCompletionListener { it.release(); player = null }
                          prepare()
                          start()
                      }
                      status.text = "Воспроизведение: ${file.name}"
                  } catch (e: Exception) { status.text = "Ошибка воспроизведения: ${e.message}" }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 1 && grantResults.firstOrNull() == PackageManager.PERMISSION_GRANTED) beginRecording()
                  else status.text = "Для записи требуется разрешение на микрофон."
              }

              override fun onDestroy() {
                  if (recorder != null) endRecording()
                  player?.release(); player = null
                  super.onDestroy()
              }
          }
          KOTLIN
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CallRec-debug-apk
          path: app/build/outputs/apk/debug/*.apk
